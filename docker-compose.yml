version: "3.9"

networks:
  app_network:
    driver: bridge

volumes:
  security_data:
  cajeros_data:
  clientes_data:
  interbanking_data:
  notifications_data:
  conciliacion_data:
  liquidaciones_data:
  legacy_data:
  creditos_data:
  configuraciones_data:
  tesoreria_data:
  auditoria_data:
  contabilidad_data:

services:

  # ──────────────────────────────────────────
  # Nginx - reverse proxy externo
  # ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - proxy
      - creditos
      - creditos-portal
    networks:
      - app_network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Frontend React + Vite
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=/api
    networks:
      - app_network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # API Gateway (proxy)
  # ──────────────────────────────────────────
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    environment:
      - SECURITY_SERVICE_URL=http://security:8001
      - CAJEROS_SERVICE_URL=http://cajeros:8002
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - INTERBANKING_SERVICE_URL=http://interbanking:8004
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
      - CONCILIACION_SERVICE_URL=http://conciliacion:8006
      - LIQUIDACIONES_SERVICE_URL=http://liquidaciones:8007
      - LEGACY_SERVICE_URL=http://legacy:8009
      - CREDITOS_SERVICE_URL=http://creditos:8010
      - CONFIGURACIONES_SERVICE_URL=http://configuraciones:8011
      - TESORERIA_SERVICE_URL=http://tesoreria:8012
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      # Auditoría central: el gateway registra toda operación que modifica datos.
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
      - CONTABILIDAD_SERVICE_URL=http://contabilidad:8014
      - JWT_SECRET=${JWT_SECRET}
      - PERMISSIONS_CACHE_TTL=60
    depends_on:
      - security
      - cajeros
      - clientes
      - interbanking
      - notifications
      - conciliacion
      - liquidaciones
      - legacy
      - creditos
      - configuraciones
      - tesoreria
      - auditoria
      - contabilidad
    networks:
      - app_network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Seguridad
  # ──────────────────────────────────────────
  security:
    build:
      context: ./modules/security
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${SECURITY_DB_USER}:${SECURITY_DB_PASS}@db_security:5432/${SECURITY_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_HOURS=8
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    depends_on:
      db_security:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_security:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${SECURITY_DB_NAME}
      - POSTGRES_USER=${SECURITY_DB_USER}
      - POSTGRES_PASSWORD=${SECURITY_DB_PASS}
    volumes:
      - security_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SECURITY_DB_USER} -d ${SECURITY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Cajeros
  # ──────────────────────────────────────────
  cajeros:
    build:
      context: ./modules/cajeros
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${CAJEROS_DB_USER}:${CAJEROS_DB_PASS}@db_cajeros:5432/${CAJEROS_DB_NAME}
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    depends_on:
      db_cajeros:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_cajeros:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${CAJEROS_DB_NAME}
      - POSTGRES_USER=${CAJEROS_DB_USER}
      - POSTGRES_PASSWORD=${CAJEROS_DB_PASS}
    volumes:
      - cajeros_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAJEROS_DB_USER} -d ${CAJEROS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Clientes
  # ──────────────────────────────────────────
  clientes:
    build:
      context: ./modules/clientes
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${CLIENTES_DB_USER}:${CLIENTES_DB_PASS}@db_clientes:5432/${CLIENTES_DB_NAME}
      - LEGACY_SERVICE_URL=http://legacy:8009
      - LEGACY_INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    depends_on:
      db_clientes:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_clientes:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${CLIENTES_DB_NAME}
      - POSTGRES_USER=${CLIENTES_DB_USER}
      - POSTGRES_PASSWORD=${CLIENTES_DB_PASS}
    volumes:
      - clientes_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLIENTES_DB_USER} -d ${CLIENTES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Interbanking
  # ──────────────────────────────────────────
  interbanking:
    build:
      context: ./modules/interbanking
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${INTERBANKING_DB_USER}:${INTERBANKING_DB_PASS}@db_interbanking:5432/${INTERBANKING_DB_NAME}
      - INTERBANKING_BASE_URL=${INTERBANKING_BASE_URL}
      - INTERBANKING_AUTH_URL=${INTERBANKING_AUTH_URL}
      - ENCRYPTION_KEY=${INTERBANKING_ENCRYPTION_KEY}
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    depends_on:
      db_interbanking:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_interbanking:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${INTERBANKING_DB_NAME}
      - POSTGRES_USER=${INTERBANKING_DB_USER}
      - POSTGRES_PASSWORD=${INTERBANKING_DB_PASS}
    volumes:
      - interbanking_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INTERBANKING_DB_USER} -d ${INTERBANKING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Notificaciones
  # ──────────────────────────────────────────
  notifications:
    build:
      context: ./modules/notifications
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://notif_user:notif_pass@db_notifications:5432/notifications_db
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    depends_on:
      db_notifications:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_notifications:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=notifications_db
      - POSTGRES_USER=notif_user
      - POSTGRES_PASSWORD=notif_pass
    volumes:
      - notifications_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notifications_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Conciliación
  # ──────────────────────────────────────────
  conciliacion:
    build:
      context: ./modules/conciliacion
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://concil_user:concil_pass@db_conciliacion:5432/conciliacion_db
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - INTERBANKING_SERVICE_URL=http://interbanking:8004
      - LEGACY_SERVICE_URL=http://legacy:8009
      - LEGACY_INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
      # Pagos salientes automáticos. Arrancan seguros: apagados y en simulación.
      # Poné AUTO_PAYMENTS_ENABLED=true y PAYMENTS_DRY_RUN=false para pagar de verdad.
      - AUTO_PAYMENTS_ENABLED=${CONCILIACION_AUTO_PAYMENTS_ENABLED:-false}
      - PAYMENTS_DRY_RUN=${CONCILIACION_PAYMENTS_DRY_RUN:-true}
      # Con Tesorería los pagos van en un lote que aprueba el tesorero (PAYMENTS_DRY_RUN no aplica).
      - PAYMENTS_VIA_TESORERIA=${CONCILIACION_PAYMENTS_VIA_TESORERIA:-true}
      - TESORERIA_SERVICE_URL=http://tesoreria:8012
      - TESORERIA_INTERNAL_API_KEY=${TESORERIA_INTERNAL_API_KEY}
    depends_on:
      db_conciliacion:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_conciliacion:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=conciliacion_db
      - POSTGRES_USER=concil_user
      - POSTGRES_PASSWORD=concil_pass
    volumes:
      - conciliacion_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concil_user -d conciliacion_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Liquidaciones
  # ──────────────────────────────────────────
  liquidaciones:
    build:
      context: ./modules/liquidaciones
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${LIQUIDACIONES_DB_USER}:${LIQUIDACIONES_DB_PASS}@db_liquidaciones:5432/${LIQUIDACIONES_DB_NAME}
      - CONCILIACION_SERVICE_URL=http://conciliacion:8006
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
      - INTERNAL_API_KEY=${LIQUIDACIONES_INTERNAL_API_KEY}
      - LEGACY_SERVICE_URL=http://legacy:8009
      - LEGACY_INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
      - INBOX_DIR=/data/liquidaciones/inbox
      - INBOX_CRON_HOUR=${LIQUIDACIONES_INBOX_CRON_HOUR:-7}
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    volumes:
      - ./externalfiles:/data/externalfiles:ro
      # Carpeta de entrada del archivo diario de liquidación. Apuntar
      # LIQUIDACIONES_INBOX_HOST_PATH al share real donde cae el archivo cada mañana.
      - ${LIQUIDACIONES_INBOX_HOST_PATH:-./externalfiles/liquidaciones_inbox}:/data/liquidaciones/inbox:rw
    depends_on:
      db_liquidaciones:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_liquidaciones:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${LIQUIDACIONES_DB_NAME}
      - POSTGRES_USER=${LIQUIDACIONES_DB_USER}
      - POSTGRES_PASSWORD=${LIQUIDACIONES_DB_PASS}
    volumes:
      - liquidaciones_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIQUIDACIONES_DB_USER} -d ${LIQUIDACIONES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Legacy (integración VFP9 / DBF) — apagable
  # ──────────────────────────────────────────
  legacy:
    build:
      context: ./modules/legacy
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${LEGACY_DB_USER}:${LEGACY_DB_PASS}@db_legacy:5432/${LEGACY_DB_NAME}
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
      - INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
      - SMB_MOUNT_ROOT=/data/agjs
      - INTEGRATION_ENABLED=${LEGACY_INTEGRATION_ENABLED:-true}
      - WRITE_MODE=${LEGACY_WRITE_MODE:-outbox_only}
      - ALLOW_REAL_DRAIN=${LEGACY_ALLOW_REAL_DRAIN:-false}
      - SANDBOX_WRITE_ROOT=/data/agjs_sandbox
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    volumes:
      # Montaje SMB/CIFS del share legacy hecho en el HOST, bind-mount read-only.
      # Ajustar la ruta del host (${LEGACY_SHARE_HOST_PATH}) al punto de montaje real.
      - ${LEGACY_SHARE_HOST_PATH:-./externalfiles}:/data/agjs:ro
      # Copia sandbox para drenado real de prueba (Fase 4); NUNCA el share productivo.
      - ${LEGACY_SANDBOX_HOST_PATH:-./externalfiles/_sandbox}:/data/agjs_sandbox:rw
    depends_on:
      db_legacy:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_legacy:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${LEGACY_DB_NAME}
      - POSTGRES_USER=${LEGACY_DB_USER}
      - POSTGRES_PASSWORD=${LEGACY_DB_PASS}
    volumes:
      - legacy_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEGACY_DB_USER} -d ${LEGACY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Configuraciones — impuestos, índices, feriados y workflow (API :8011)
  # ──────────────────────────────────────────
  configuraciones:
    build:
      context: ./modules/configuraciones
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${CONFIGURACIONES_DB_USER}:${CONFIGURACIONES_DB_PASS}@db_configuraciones:5432/${CONFIGURACIONES_DB_NAME}
      - INTERNAL_API_KEY=${CONFIGURACIONES_INTERNAL_API_KEY}
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    depends_on:
      db_configuraciones:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_configuraciones:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${CONFIGURACIONES_DB_NAME}
      - POSTGRES_USER=${CONFIGURACIONES_DB_USER}
      - POSTGRES_PASSWORD=${CONFIGURACIONES_DB_PASS}
    volumes:
      - configuraciones_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONFIGURACIONES_DB_USER} -d ${CONFIGURACIONES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Contabilidad — transacciones de los módulos → asientos, libros y estados (API :8014)
  # ──────────────────────────────────────────
  contabilidad:
    build:
      context: ./modules/contabilidad
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${CONTABILIDAD_DB_USER}:${CONTABILIDAD_DB_PASS}@db_contabilidad:5432/${CONTABILIDAD_DB_NAME}
      # La presentan los módulos al mandar sus transacciones (nunca asientos).
      - INTERNAL_API_KEY=${CONTABILIDAD_INTERNAL_API_KEY}
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
    depends_on:
      db_contabilidad:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_contabilidad:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${CONTABILIDAD_DB_NAME}
      - POSTGRES_USER=${CONTABILIDAD_DB_USER}
      - POSTGRES_PASSWORD=${CONTABILIDAD_DB_PASS}
    volumes:
      - contabilidad_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTABILIDAD_DB_USER} -d ${CONTABILIDAD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Auditoría — qué hace cada usuario con la información del sistema (API :8013)
  # ──────────────────────────────────────────
  auditoria:
    build:
      context: ./modules/auditoria
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${AUDITORIA_DB_USER}:${AUDITORIA_DB_PASS}@db_auditoria:5432/${AUDITORIA_DB_NAME}
      # La presentan el gateway y los módulos para registrar. Sin clave, nadie puede escribir el registro.
      - INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
      # Retención: 5 años (1825 días). La purga corre sola, de madrugada.
      - RETENCION_DIAS=${AUDITORIA_RETENCION_DIAS:-1825}
    depends_on:
      db_auditoria:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_auditoria:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${AUDITORIA_DB_NAME}
      - POSTGRES_USER=${AUDITORIA_DB_USER}
      - POSTGRES_PASSWORD=${AUDITORIA_DB_PASS}
    volumes:
      - auditoria_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDITORIA_DB_USER} -d ${AUDITORIA_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Tesorería — lotes de pagos: aprobación (workflow) y envío por Interbanking (API :8012)
  # ──────────────────────────────────────────
  tesoreria:
    build:
      context: ./modules/tesoreria
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${TESORERIA_DB_USER}:${TESORERIA_DB_PASS}@db_tesoreria:5432/${TESORERIA_DB_NAME}
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
      - CONTABILIDAD_SERVICE_URL=http://contabilidad:8014
      - CONTABILIDAD_INTERNAL_API_KEY=${CONTABILIDAD_INTERNAL_API_KEY}
      # Autentica a los módulos que le mandan lotes y a los avisos de resultado que Tesorería les devuelve.
      - INTERNAL_API_KEY=${TESORERIA_INTERNAL_API_KEY}
      - INTERBANKING_SERVICE_URL=http://interbanking:8004
      - CONFIGURACIONES_SERVICE_URL=http://configuraciones:8011
      - CONFIGURACIONES_INTERNAL_API_KEY=${CONFIGURACIONES_INTERNAL_API_KEY}
      # true = simulación: aprueba y "envía" sin mover dinero. Poner false sólo con la cuenta de pagos lista.
      - ENVIO_SIMULADO=${TESORERIA_ENVIO_SIMULADO:-true}
    depends_on:
      db_tesoreria:
        condition: service_healthy
      configuraciones:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

  db_tesoreria:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${TESORERIA_DB_NAME}
      - POSTGRES_USER=${TESORERIA_DB_USER}
      - POSTGRES_PASSWORD=${TESORERIA_DB_PASS}
    volumes:
      - tesoreria_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TESORERIA_DB_USER} -d ${TESORERIA_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Créditos (CCyPP) — API :8010 + portal ciudadano /portal-creditos/
  # (el backoffice es parte del frontend de Portezuelo: /modules/creditos/)
  # ──────────────────────────────────────────
  creditos:
    build:
      context: ./modules/creditos/backend
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${CREDITOS_DB_USER}:${CREDITOS_DB_PASS}@db_creditos:5432/${CREDITOS_DB_NAME}
      - AUDITORIA_SERVICE_URL=http://auditoria:8013
      - AUDITORIA_INTERNAL_API_KEY=${AUDITORIA_INTERNAL_API_KEY}
      - CONTABILIDAD_SERVICE_URL=http://contabilidad:8014
      - CONTABILIDAD_INTERNAL_API_KEY=${CONTABILIDAD_INTERNAL_API_KEY}
      # Firma SOLO los tokens del portal ciudadano (realm propio). Debe ser distinto de JWT_SECRET:
      # los usuarios del backoffice los autentica el gateway de Portezuelo.
      - JWT_SECRET=${CREDITOS_PORTAL_JWT_SECRET}
      # SSO Mi Catamarca del portal. Sin credenciales, el login del portal responde 503 salvo que se
      # habilite el proveedor MOCK (sólo demo/QA: deja entrar a cualquiera como un ciudadano de prueba).
      - MICATAMARCA_CLIENT_ID=${MICATAMARCA_CLIENT_ID:-}
      - MICATAMARCA_CLIENT_SECRET=${MICATAMARCA_CLIENT_SECRET:-}
      - MICATAMARCA_REDIRECT_URI=${CREDITOS_PUBLIC_URL:-http://localhost}/api/creditos/portal/auth/callback
      - PORTAL_WEB_URL=${CREDITOS_PUBLIC_URL:-http://localhost}/portal-creditos
      - PORTAL_MOCK_SSO=${CREDITOS_PORTAL_MOCK_SSO:-false}
      # Impuestos, índices, feriados y reglas del workflow: los lee de Configuraciones (API interna).
      - CONFIGURACIONES_SERVICE_URL=http://configuraciones:8011
      - CONFIGURACIONES_INTERNAL_API_KEY=${CONFIGURACIONES_INTERNAL_API_KEY}
      # Desembolsos por Tesorería: el contrato pasa a ACTIVO cuando se acredita la transferencia.
      - DESEMBOLSO_VIA_TESORERIA=${CREDITOS_DESEMBOLSO_VIA_TESORERIA:-true}
      - TESORERIA_SERVICE_URL=http://tesoreria:8012
      - TESORERIA_INTERNAL_API_KEY=${TESORERIA_INTERNAL_API_KEY}
    volumes:
      # Backup DBF del sistema VFP para el ETL (read-only):
      #   docker compose exec creditos python3 -m app.etl.cargar_todo /bases
      - ${CREDITOS_BASES_HOST_PATH:-./externalfiles/creditos_bases}:/bases:ro
    depends_on:
      db_creditos:
        condition: service_healthy
      configuraciones:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

  db_creditos:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${CREDITOS_DB_NAME}
      - POSTGRES_USER=${CREDITOS_DB_USER}
      - POSTGRES_PASSWORD=${CREDITOS_DB_PASS}
    volumes:
      - creditos_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CREDITOS_DB_USER} -d ${CREDITOS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  creditos-portal:
    build:
      context: ./modules/creditos/portal
      dockerfile: Dockerfile
    volumes:
      # Videos obligatorios del paso 4 (video1.mp4, video2.mp4, video3.mp4), read-only.
      - ${CREDITOS_PORTAL_VIDEOS_HOST_PATH:-./externalfiles/portal_videos}:/videos:ro
    networks:
      - app_network
    restart: unless-stopped
