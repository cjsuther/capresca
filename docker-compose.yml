version: "3.9"

networks:
  app_network:
    driver: bridge

volumes:
  security_data:
  cajeros_data:
  clientes_data:
  interbanking_data:
  notifications_data:
  conciliacion_data:
  liquidaciones_data:
  comunicacion_data:
  comunicacion_media:
  legacy_data:

services:

  # ──────────────────────────────────────────
  # Nginx - reverse proxy externo
  # ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - proxy
    networks:
      - app_network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Frontend React + Vite
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=/api
    networks:
      - app_network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # API Gateway (proxy)
  # ──────────────────────────────────────────
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    environment:
      - SECURITY_SERVICE_URL=http://security:8001
      - CAJEROS_SERVICE_URL=http://cajeros:8002
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - INTERBANKING_SERVICE_URL=http://interbanking:8004
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
      - CONCILIACION_SERVICE_URL=http://conciliacion:8006
      - LIQUIDACIONES_SERVICE_URL=http://liquidaciones:8007
      - COMUNICACION_SERVICE_URL=http://comunicacion:8008
      - LEGACY_SERVICE_URL=http://legacy:8009
      - JWT_SECRET=${JWT_SECRET}
      - PERMISSIONS_CACHE_TTL=60
    depends_on:
      - security
      - cajeros
      - clientes
      - interbanking
      - notifications
      - conciliacion
      - liquidaciones
      - comunicacion
      - legacy
    networks:
      - app_network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Seguridad
  # ──────────────────────────────────────────
  security:
    build:
      context: ./modules/security
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${SECURITY_DB_USER}:${SECURITY_DB_PASS}@db_security:5432/${SECURITY_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_HOURS=8
    depends_on:
      db_security:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_security:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${SECURITY_DB_NAME}
      - POSTGRES_USER=${SECURITY_DB_USER}
      - POSTGRES_PASSWORD=${SECURITY_DB_PASS}
    volumes:
      - security_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SECURITY_DB_USER} -d ${SECURITY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Cajeros
  # ──────────────────────────────────────────
  cajeros:
    build:
      context: ./modules/cajeros
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${CAJEROS_DB_USER}:${CAJEROS_DB_PASS}@db_cajeros:5432/${CAJEROS_DB_NAME}
      - SECURITY_SERVICE_URL=http://security:8001
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8005
    depends_on:
      db_cajeros:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_cajeros:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${CAJEROS_DB_NAME}
      - POSTGRES_USER=${CAJEROS_DB_USER}
      - POSTGRES_PASSWORD=${CAJEROS_DB_PASS}
    volumes:
      - cajeros_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAJEROS_DB_USER} -d ${CAJEROS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Clientes
  # ──────────────────────────────────────────
  clientes:
    build:
      context: ./modules/clientes
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${CLIENTES_DB_USER}:${CLIENTES_DB_PASS}@db_clientes:5432/${CLIENTES_DB_NAME}
      - SECURITY_SERVICE_URL=http://security:8001
      - LEGACY_SERVICE_URL=http://legacy:8009
      - LEGACY_INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
    depends_on:
      db_clientes:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_clientes:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${CLIENTES_DB_NAME}
      - POSTGRES_USER=${CLIENTES_DB_USER}
      - POSTGRES_PASSWORD=${CLIENTES_DB_PASS}
    volumes:
      - clientes_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLIENTES_DB_USER} -d ${CLIENTES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Interbanking
  # ──────────────────────────────────────────
  interbanking:
    build:
      context: ./modules/interbanking
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${INTERBANKING_DB_USER}:${INTERBANKING_DB_PASS}@db_interbanking:5432/${INTERBANKING_DB_NAME}
      - INTERBANKING_BASE_URL=${INTERBANKING_BASE_URL}
      - INTERBANKING_AUTH_URL=${INTERBANKING_AUTH_URL}
      - ENCRYPTION_KEY=${INTERBANKING_ENCRYPTION_KEY}
      - SECURITY_SERVICE_URL=http://security:8001
    depends_on:
      db_interbanking:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_interbanking:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${INTERBANKING_DB_NAME}
      - POSTGRES_USER=${INTERBANKING_DB_USER}
      - POSTGRES_PASSWORD=${INTERBANKING_DB_PASS}
    volumes:
      - interbanking_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INTERBANKING_DB_USER} -d ${INTERBANKING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Notificaciones
  # ──────────────────────────────────────────
  notifications:
    build:
      context: ./modules/notifications
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://notif_user:notif_pass@db_notifications:5432/notifications_db
    depends_on:
      db_notifications:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_notifications:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=notifications_db
      - POSTGRES_USER=notif_user
      - POSTGRES_PASSWORD=notif_pass
    volumes:
      - notifications_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notifications_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Conciliación
  # ──────────────────────────────────────────
  conciliacion:
    build:
      context: ./modules/conciliacion
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://concil_user:concil_pass@db_conciliacion:5432/conciliacion_db
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - INTERBANKING_SERVICE_URL=http://interbanking:8004
      - LEGACY_SERVICE_URL=http://legacy:8009
      - LEGACY_INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
    depends_on:
      db_conciliacion:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_conciliacion:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=conciliacion_db
      - POSTGRES_USER=concil_user
      - POSTGRES_PASSWORD=concil_pass
    volumes:
      - conciliacion_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concil_user -d conciliacion_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Liquidaciones
  # ──────────────────────────────────────────
  liquidaciones:
    build:
      context: ./modules/liquidaciones
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${LIQUIDACIONES_DB_USER}:${LIQUIDACIONES_DB_PASS}@db_liquidaciones:5432/${LIQUIDACIONES_DB_NAME}
      - CONCILIACION_SERVICE_URL=http://conciliacion:8006
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - INTERNAL_API_KEY=${LIQUIDACIONES_INTERNAL_API_KEY}
      - LEGACY_SERVICE_URL=http://legacy:8009
      - LEGACY_INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
    volumes:
      - ./externalfiles:/data/externalfiles:ro
    depends_on:
      db_liquidaciones:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_liquidaciones:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${LIQUIDACIONES_DB_NAME}
      - POSTGRES_USER=${LIQUIDACIONES_DB_USER}
      - POSTGRES_PASSWORD=${LIQUIDACIONES_DB_PASS}
    volumes:
      - liquidaciones_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIQUIDACIONES_DB_USER} -d ${LIQUIDACIONES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Legacy (integración VFP9 / DBF) — apagable
  # ──────────────────────────────────────────
  legacy:
    build:
      context: ./modules/legacy
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${LEGACY_DB_USER}:${LEGACY_DB_PASS}@db_legacy:5432/${LEGACY_DB_NAME}
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - CONCILIACION_SERVICE_URL=http://conciliacion:8006
      - INTERBANKING_SERVICE_URL=http://interbanking:8004
      - INTERNAL_API_KEY=${LEGACY_INTERNAL_API_KEY}
      - SMB_MOUNT_ROOT=/data/agjs
      - INTEGRATION_ENABLED=${LEGACY_INTEGRATION_ENABLED:-true}
      - WRITE_MODE=${LEGACY_WRITE_MODE:-outbox_only}
      - ALLOW_REAL_DRAIN=${LEGACY_ALLOW_REAL_DRAIN:-false}
      - SANDBOX_WRITE_ROOT=/data/agjs_sandbox
    volumes:
      # Montaje SMB/CIFS del share legacy hecho en el HOST, bind-mount read-only.
      # Ajustar la ruta del host (${LEGACY_SHARE_HOST_PATH}) al punto de montaje real.
      - ${LEGACY_SHARE_HOST_PATH:-./externalfiles}:/data/agjs:ro
      # Copia sandbox para drenado real de prueba (Fase 4); NUNCA el share productivo.
      - ${LEGACY_SANDBOX_HOST_PATH:-./externalfiles/_sandbox}:/data/agjs_sandbox:rw
    depends_on:
      db_legacy:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_legacy:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${LEGACY_DB_NAME}
      - POSTGRES_USER=${LEGACY_DB_USER}
      - POSTGRES_PASSWORD=${LEGACY_DB_PASS}
    volumes:
      - legacy_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEGACY_DB_USER} -d ${LEGACY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Módulo Comunicación
  # ──────────────────────────────────────────
  comunicacion:
    build:
      context: ./modules/comunicacion
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${COMUNICACION_DB_USER}:${COMUNICACION_DB_PASS}@db_comunicacion:5432/${COMUNICACION_DB_NAME}
      - CLIENTES_SERVICE_URL=http://clientes:8003
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - MEDIA_STORAGE_PATH=/data/comunicacion/media
    volumes:
      - comunicacion_media:/data/comunicacion/media
    depends_on:
      db_comunicacion:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  db_comunicacion:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${COMUNICACION_DB_NAME}
      - POSTGRES_USER=${COMUNICACION_DB_USER}
      - POSTGRES_PASSWORD=${COMUNICACION_DB_PASS}
    volumes:
      - comunicacion_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMUNICACION_DB_USER} -d ${COMUNICACION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
