server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan hash en el nombre: cambian de nombre en cada build, así que se pueden
    # cachear para siempre sin quedarse viejos.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NO se cachea: es quien dice qué bundle cargar. Si el navegador se lo queda, sigue
    # pidiendo el JS del deploy anterior y las correcciones no llegan aunque el servidor ya esté al día.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
