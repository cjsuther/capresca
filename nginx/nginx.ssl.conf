worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Límite de intentos de login: 10 por minuto por IP (ráfaga de 5). Sin esto, la fuerza bruta
    # contra /api/auth/login es libre.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    # Gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream frontend {
        server frontend:3000;
    }

    upstream proxy {
        server proxy:8000;
    }

    # ── HTTP ─────────────────────────────────────────────────────────────────────────────────
    # Sólo dos cosas: el desafío de Let's Encrypt (que viaja por HTTP a propósito) y mandar todo
    # lo demás a HTTPS, incluido quien todavía entre por la IP.
    server {
        listen 80;
        server_name _;

        include /etc/nginx/acme.conf;

        location / {
            return 301 https://dev.ccypp.gob.ar$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name dev.ccypp.gob.ar;

        ssl_certificate     /etc/letsencrypt/live/dev.ccypp.gob.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.ccypp.gob.ar/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/dev.ccypp.gob.ar/chain.pem;

        # Sólo TLS 1.2 y 1.3, con las suites que recomienda Mozilla (perfil intermedio).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS: el navegador no vuelve a intentar por HTTP. Un año, como recomienda Mozilla.
        add_header Strict-Transport-Security "max-age=31536000" always;

        include /etc/nginx/locations.conf;
    }
}
