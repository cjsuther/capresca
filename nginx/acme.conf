# Desafío de Let's Encrypt: viaja por HTTP a propósito (es el único que no se redirige a HTTPS).
# Lo incluyen el server de HTTP y locations.conf, así la primera emisión del certificado funciona
# aunque todavía estemos sirviendo sólo por HTTP.
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}
