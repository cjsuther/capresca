# Producción: portezuelo.ccypp.gob.ar (el sistema) y mi.ccypp.gob.ar (el portal ciudadano), con un
# solo certificado de Let's Encrypt para los dos nombres (live/portezuelo.ccypp.gob.ar).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Límite de intentos de login: 10 por minuto por IP (ráfaga de 5). Sin esto, la fuerza bruta
    # contra /api/auth/login es libre.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    # Doble factor (código del login, enrolamiento, step-up): más holgado, varias personas pueden salir por la misma IP.
    limit_req_zone $binary_remote_addr zone=dosfa:10m rate=30r/m;
    # Portal ciudadano: el inicio de sesión (cada pedido guarda un intento) y el resto de su API.
    limit_req_zone $binary_remote_addr zone=portal_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=portal_api:10m rate=120r/m;
    # No anunciar la versión de nginx.
    server_tokens off;
    limit_req_status 429;

    # Gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream frontend {
        server frontend:3000;
    }

    upstream proxy {
        server proxy:8000;
    }

    # ── HTTP ─────────────────────────────────────────────────────────────────────────────────
    # El desafío de Let's Encrypt y la redirección a HTTPS, conservando el dominio pedido. Quien entre
    # por la IP o por otro nombre va al sistema.
    server {
        listen 80;
        server_name portezuelo.ccypp.gob.ar mi.ccypp.gob.ar;

        include /etc/nginx/acme.conf;

        location / {
            return 301 https://$host$request_uri;
        }
    }
    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/acme.conf;

        location / {
            return 301 https://portezuelo.ccypp.gob.ar$request_uri;
        }
    }

    # ── HTTPS: el sistema ────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name portezuelo.ccypp.gob.ar;

        ssl_certificate     /etc/letsencrypt/live/portezuelo.ccypp.gob.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/portezuelo.ccypp.gob.ar/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/portezuelo.ccypp.gob.ar/chain.pem;

        # Sólo TLS 1.2 y 1.3, con las suites que recomienda Mozilla (perfil intermedio).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS: el navegador no vuelve a intentar por HTTP. Un año, como recomienda Mozilla.
        add_header Strict-Transport-Security "max-age=31536000" always;

        include /etc/nginx/locations.conf;
    }

    # ── HTTPS: el portal ciudadano ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name mi.ccypp.gob.ar;

        ssl_certificate     /etc/letsencrypt/live/portezuelo.ccypp.gob.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/portezuelo.ccypp.gob.ar/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/portezuelo.ccypp.gob.ar/chain.pem;

        # Sólo TLS 1.2 y 1.3, con las suites que recomienda Mozilla (perfil intermedio).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS: el navegador no vuelve a intentar por HTTP. Un año, como recomienda Mozilla.
        add_header Strict-Transport-Security "max-age=31536000" always;

        include /etc/nginx/portal-locations.conf;
    }

    # ── TokenServer: token.bluunit.com ───────────────────────────────────────────────────────
    # Proyecto compose aparte (/opt/tokenserver). Su admin-web está en app_network con el alias
    # tokenserver-web y es la única entrada (panel, /admin/api, /v1, /healthz, /docs).
    # Origen: deploy/capresca-nginx/ del repo de TokenServer (README con el procedimiento).
    #
    # ATENCIÓN: el server de 443 referencia live/token.bluunit.com. Si el certificado no existe,
    # nginx NO arranca (y se cae Capresca). Emitirlo ANTES de desplegar este cambio.
    server {
        listen 80;
        server_name token.bluunit.com;

        include /etc/nginx/acme.conf;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name token.bluunit.com;

        ssl_certificate     /etc/letsencrypt/live/token.bluunit.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/token.bluunit.com/privkey.pem;

        # Mismo perfil que el resto (Mozilla intermedio). Sin OCSP stapling: Let's Encrypt dejó de
        # publicar OCSP en 2025 y sus certificados nuevos no traen URL de OCSP.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # HSTS acá; CSP, X-Frame-Options, nosniff y Referrer-Policy los pone admin-web (no se
        # repiten para no mandar headers duplicados).
        add_header Strict-Transport-Security "max-age=31536000" always;

        # El panel y la API sólo aceptan cuerpos chicos (admin-web corta en 64k).
        client_max_body_size 64k;

        location / {
            # Nombre resuelto en cada pedido (DNS de Docker), no al arrancar: si TokenServer está
            # caído o todavía no se desplegó, este server responde 502 pero nginx arranca igual y
            # Capresca no se entera.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $tokenserver_upstream http://tokenserver-web:8080;
            proxy_pass $tokenserver_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # admin-web confía en este X-Forwarded-For sólo si la conexión viene de este nginx.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
