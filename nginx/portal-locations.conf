# Rutas del dominio del portal ciudadano (mi.ccypp.gob.ar). Sólo el portal y su API: el sistema
# interno (Portezuelo) no se publica por este dominio. La API del portal va directo a Créditos, con
# su propio login (Mi Catamarca), igual que en locations.conf.

    include /etc/nginx/acme.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # API del portal (incluye el callback de Mi Catamarca: /api/creditos/portal/auth/callback).
    location /api/creditos/portal/ {
        set $creditos_api creditos:8010;
        proxy_pass http://$creditos_api$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_set_header X-Username "";
        proxy_set_header X-User-Permissions "";
        client_max_body_size 20M;
    }

    # El portal está en la raíz del dominio (se compila con PORTAL_BASE=/). Los videos, sin buffer para
    # que el navegador los pida por partes (Range).
    location /videos/ {
        set $creditos_portal creditos-portal:3000;
        proxy_pass http://$creditos_portal;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Los accesos viejos con /portal-creditos/ vuelven a la raíz.
    location ~ ^/portal-creditos(/|$) {
        return 301 /;
    }

    location / {
        set $creditos_portal creditos-portal:3000;
        proxy_pass http://$creditos_portal;
        proxy_set_header Host $host;
    }
