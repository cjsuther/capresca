worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream frontend {
        server frontend:3000;
    }

    upstream proxy {
        server proxy:8000;
    }

    server {
        listen 80;
        server_name _;

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Endpoint interno de liquidaciones (autenticado por API key)
        location /internal/liquidaciones/ {
            proxy_pass http://liquidaciones:8007;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            client_max_body_size 50M;
        }

        # Créditos: los upstreams van en variables para que nginx los re-resuelva con el DNS de Docker
        # (los contenedores se recrean en cada deploy y cambian de IP; un upstream fijo queda apuntando
        # a la IP vieja → 502).
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Créditos — API del portal ciudadano: directo al módulo, SIN gateway (realm propio con SSO
        # Mi Catamarca; no son usuarios de Portezuelo). Sólo este prefijo; el resto de /api/creditos/*
        # pasa por el gateway. Se descartan los X-User-* que pueda mandar el cliente.
        location /api/creditos/portal/ {
            # $uri es la ruta ya normalizada (sin "..", ni codificados): no se puede salir del portal.
            set $creditos_api creditos:8010;
            proxy_pass http://$creditos_api$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id "";
            proxy_set_header X-Username "";
            proxy_set_header X-User-Permissions "";
            client_max_body_size 20M;
        }

        # Créditos — backoffice (SPA propia; usa la sesión de Portezuelo)
        location /creditos/ {
            set $creditos_web creditos-web:3000;
            proxy_pass http://$creditos_web;
            proxy_set_header Host $host;
        }
        location = /creditos {
            return 301 /creditos/;
        }

        # Créditos — portal público del ciudadano
        location /portal-creditos/ {
            set $creditos_portal creditos-portal:3000;
            proxy_pass http://$creditos_portal;
            proxy_set_header Host $host;
        }
        location = /portal-creditos {
            return 301 /portal-creditos/;
        }

        # Todas las rutas /api/* van al gateway
        location /api/ {
            proxy_pass http://proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # El resto va al frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte para SPA (React Router)
            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        location @frontend_fallback {
            proxy_pass http://frontend;
        }
    }
}
