# Rutas y cabeceras del sitio. Lo incluyen los dos `server` (el de HTTP para desarrollo y el de
# HTTPS del servidor), así no hay dos copias de las mismas reglas que se van separando con el tiempo.

    include /etc/nginx/acme.conf;

    # Cabeceras de seguridad para todas las respuestas (las SPAs y la API).
    # `always` para que también viajen en respuestas de error.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Los SPAs usan estilos en línea (style= y <style> por pantalla); scripts, sólo los propios.
    # `frame-src blob:`: la vista previa de PDF los muestra en un <iframe> con el archivo ya
    # descargado (blob), sin abrir otra pestaña. Sin esto el visor quedaba en blanco.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Endpoint interno de liquidaciones (autenticado por API key)
    location /internal/liquidaciones/ {
        proxy_pass http://liquidaciones:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Clientes — la importación del padrón sube un ZIP de ~10 MB (el DBF suelto, ~50).
    # Clientes — la importación del padrón sube un ZIP de ~10 MB (o el DBF suelto, ~50), y el
    # límite general está en 10M. Va al gateway como cualquier /api/, sólo cambia el tamaño.
    location /api/clientes/padron/ {
        proxy_pass http://proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        client_max_body_size 200M;
    }

    # Créditos: los upstreams van en variables para que nginx los re-resuelva con el DNS de Docker
    # (los contenedores se recrean en cada deploy y cambian de IP; un upstream fijo queda apuntando
    # a la IP vieja → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Créditos — API del portal ciudadano: directo al módulo, SIN gateway (realm propio con SSO
    # Mi Catamarca; no son usuarios de Portezuelo). Sólo este prefijo; el resto de /api/creditos/*
    # pasa por el gateway. Se descartan los X-User-* que pueda mandar el cliente.
    location /api/creditos/portal/ {
        # $uri es la ruta ya normalizada (sin "..", ni codificados): no se puede salir del portal.
        set $creditos_api creditos:8010;
        proxy_pass http://$creditos_api$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_set_header X-Username "";
        proxy_set_header X-User-Permissions "";
        client_max_body_size 20M;
    }

    # Créditos — el backoffice vive en el frontend de Portezuelo (/modules/creditos/). La SPA
    # propia que se publicaba en /creditos/ se retiró: los accesos guardados van al módulo.
    location ~ ^/creditos(/|$) {
        return 301 /modules/creditos/;
    }

    # Créditos — videos del portal: sin buffer, para que el navegador los reproduzca por partes (Range)
    location /portal-creditos/videos/ {
        set $creditos_portal creditos-portal:3000;
        proxy_pass http://$creditos_portal;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Créditos — portal público del ciudadano
    location /portal-creditos/ {
        set $creditos_portal creditos-portal:3000;
        proxy_pass http://$creditos_portal;
        proxy_set_header Host $host;
    }
    location = /portal-creditos {
        return 301 /portal-creditos/;
    }

    # Login: mismo destino que el resto de la API, pero con límite de intentos por IP.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todas las rutas /api/* van al gateway
    location /api/ {
        proxy_pass http://proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;      # los reportes de créditos pueden tardar (gateway: 120s)
        proxy_connect_timeout 10s;
    }

    # El resto va al frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para SPA (React Router)
        proxy_intercept_errors on;
        error_page 404 = @frontend_fallback;
    }

    location @frontend_fallback {
        proxy_pass http://frontend;
    }
